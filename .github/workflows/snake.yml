name: Contribution snake

on:
  schedule:
    - cron: "0 6 * * *"   # once a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#4B9CD3&color_dots=#ebedf0,#c6e1f5,#7BAFD4,#4B9CD3,#13294B
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7BAFD4&color_dots=#161b22,#13294B,#2f6a99,#4B9CD3,#a9d4f5
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

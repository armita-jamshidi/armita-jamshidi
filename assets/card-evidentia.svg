<svg xmlns="http://www.w3.org/2000/svg" width="360" height="530" viewBox="0 0 360 530" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">EVIDENTIA: literature review engine + lakehouse. An RCT&#x27;s vote counts 1.0, a case report&#x27;s 0.3, and every research question gets a disagreement score.</title><defs><style>

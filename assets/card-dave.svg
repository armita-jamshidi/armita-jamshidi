<svg xmlns="http://www.w3.org/2000/svg" width="360" height="530" viewBox="0 0 360 530" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">DAVE: RV trip planning agent. Any bridge lower than the rig plus 6 inches triggers a reroute, before a plan can be called final.</title><defs><style>
.sans{font-family:"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bob{animation:bob 3.6s ease-in-out infinite}
.d1{animation-delay:.6s}.d2{animation-delay:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.drift{animation:drift 40s linear infinite}
.drift2{animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1300px)}}
.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.blink,.drift,.drift2,.spin,.drive,.wave,.flow,.cyc,.pop{animation:none}}
</style><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE8F8"/><stop offset="1" stop-color="#F4FAFE"/></linearGradient><clipPath id="clip"><rect width="360" height="530" rx="24"/></clipPath></defs><g clip-path="url(#clip)"><rect x="4" y="4" width="352" height="522" rx="24" fill="#fff" stroke="#2E9C74" stroke-width="5"/>

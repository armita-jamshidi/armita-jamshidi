<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t"><title id="t">Hi, I&#x27;m Armita! I&#x27;m an AI engineer and a lifelong learner! Follow along as I build projects that teach me something new and serve a purpose I care about</title><defs><g id="lb"><g class="legs" stroke="#1B1B1B" stroke-width="2.6" stroke-linecap="round"><line x1="-8" y1="-10" x2="-11" y2="-19" /><line x1="-8" y1="10" x2="-11" y2="19" /><line x1="0" y1="-10" x2="0" y2="-19" /><line x1="0" y1="10" x2="0" y2="19" /><line x1="8" y1="-10" x2="11" y2="-19" /><line x1="8" y1="10" x2="11" y2="19" /></g><path d="M24 -4 q6 -8 11 -8 M24 4 q6 8 11 8" stroke="#1B1B1B" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="35" cy="-12" r="2" fill="#1B1B1B"/><circle cx="35" cy="12" r="2" fill="#1B1B1B"/><circle cx="17" cy="0" r="9" fill="#1B1B1B"/><circle cx="21" cy="-4" r="2.2" fill="#fff"/><circle cx="21" cy="4" r="2.2" fill="#fff"/><ellipse cx="-2" cy="0" rx="18" ry="15" fill="#E63946" stroke="#1B1B1B" stroke-width="2"/><path d="M-20 0 H15" stroke="#1B1B1B" stroke-width="2"/><circle cx="-9" cy="-7" r="3.6" fill="#1B1B1B"/><circle cx="-9" cy="7" r="3.6" fill="#1B1B1B"/><circle cx="3" cy="-8" r="3" fill="#1B1B1B"/><circle cx="3" cy="8" r="3" fill="#1B1B1B"/><circle cx="-15" cy="0" r="2.4" fill="#1B1B1B" opacity="0"/><ellipse cx="-8" cy="-9" rx="4" ry="2" fill="#fff" opacity=".35"/></g><style>
.sans{font-family:"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bob{animation:bob 3.6s ease-in-out infinite}
.d1{animation-delay:.6s}.d2{animation-delay:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.drift{animation:drift 40s linear infinite}
.drift2{animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1300px)}}
.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.blink,.drift,.drift2,.spin,.drive,.wave,.flow,.cyc,.pop{animation:none}}
.cyc{opacity:0;animation:cyc 12s infinite}
@keyframes cyc{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
.wave{animation:wave 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:70% 80%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){.cyc{opacity:0}.c0{opacity:1}}.legs{animation:wig .35s ease-in-out infinite alternate}@keyframes wig{from{transform:translateX(-1.6px)}to{transform:translateX(1.6px)}}.crawl{animation:crawl var(--t,30s) linear infinite}@keyframes crawl{from{transform:translateX(-80px)}to{transform:translateX(1290px)}}.crawlL{animation:crawlL var(--t,30s) linear infinite}@keyframes crawlL{from{transform:translateX(1290px)}to{transform:translateX(-80px)}}.wob{animation:wob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-4deg)}}@media (prefers-reduced-motion:reduce){.legs,.crawl,.crawlL,.wob{animation:none}.crawl,.crawlL{transform:translateX(var(--rx,600px))}}</style><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BDEBDD"/><stop offset="1" stop-color="#E6F8F2"/></linearGradient><pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="6" fill="#5CC4A6" opacity=".35"/><circle cx="33" cy="33" r="6" fill="#5CC4A6" opacity=".35"/></pattern><clipPath id="clip"><rect width="1200" height="340" rx="24"/></clipPath></defs><g clip-path="url(#clip)"><rect width="1200" height="340" rx="26" fill="url(#sky)"/><rect width="1200" height="340" fill="url(#dots)"/>
<path d="M0 300 Q300 250 600 290 T1200 270 V340 H0 Z" fill="#8ED6C0"/>
<path d="M0 322 Q350 290 700 318 T1200 305 V340 H0 Z" fill="#5FC0A3"/>
<g class="crawl" style="--t:38s;--rx:900px;animation-delay:-6s"><g transform="translate(0 34) scale(0.8)"><g class="wob"><use href="#lb"/></g></g></g><g class="crawlL" style="--t:30s;--rx:1000px;animation-delay:-20s"><g transform="translate(0 305) scale(0.9) scale(-1 1)"><g class="wob"><use href="#lb"/></g></g></g>
<text x="64" y="78" class="mono" font-size="20" fill="#14806A">~/armita $ whoami</text>
<text x="62" y="150" class="sans" font-size="68" font-weight="800" fill="#13294B">Hi, I'm Armita!</text>
<g transform="translate(578 128)"><text class="wave" font-size="54" text-anchor="middle" dominant-baseline="middle">👋</text></g>
<text x="64" y="198" class="sans" font-size="25" fill="#13294B">I'm an AI engineer and a lifelong learner! Follow along as I build</text>
<text x="64" y="231" class="sans" font-size="25" fill="#13294B">projects that teach me something new and serve a purpose I care about</text>
<rect x="56" y="256" width="580" height="38" rx="19" fill="#fff" stroke="#2FA084" stroke-width="2"/>
<text x="76" y="281" class="mono" font-size="19" fill="#13294B">currently shipping:</text>
<text class="mono cyc c0" x="300" y="281" font-size="19" font-weight="700" fill="#4B9CD3" style="animation-delay:0s">multi-agent systems</text><text class="mono cyc c1" x="300" y="281" font-size="19" font-weight="700" fill="#FF8A65" style="animation-delay:3s">fine-tuning (QLoRA)</text><text class="mono cyc c2" x="300" y="281" font-size="19" font-weight="700" fill="#2E9C74" style="animation-delay:6s">RAG with checked quotes</text><text class="mono cyc c3" x="300" y="281" font-size="19" font-weight="700" fill="#C98A4B" style="animation-delay:9s">lakehouses, bronze to gold</text>
</g></svg>
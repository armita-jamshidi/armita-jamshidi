<g class="drift"><g transform="translate(0 60) scale(1.0)" opacity="0.95"><ellipse cx="0" cy="0" rx="46" ry="20" fill="#fff"/><circle cx="-18" cy="-10" r="20" fill="#fff"/><circle cx="12" cy="-16" r="24" fill="#fff"/></g></g>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t"><title id="t">Hi, I&#x27;m Armita! I&#x27;m an AI engineer and a lifelong learner! Follow along as I build projects that teach me something new and serve a purpose I care about</title><defs><style>
.sans{font-family:"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bob{animation:bob 3.6s ease-in-out infinite}
.d1{animation-delay:.6s}.d2{animation-delay:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.drift{animation:drift 40s linear infinite}
.drift2{animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1300px)}}
.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.blink,.drift,.drift2,.spin,.drive,.wave,.flow,.cyc,.pop{animation:none}}
.cyc{opacity:0;animation:cyc 12s infinite}
@keyframes cyc{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
.wave{animation:wave 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:70% 80%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){.cyc{opacity:0}.c0{opacity:1}}</style><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BDEBDD"/><stop offset="1" stop-color="#E6F8F2"/></linearGradient><pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="6" fill="#5CC4A6" opacity=".35"/><circle cx="33" cy="33" r="6" fill="#5CC4A6" opacity=".35"/></pattern><clipPath id="clip"><rect width="1200" height="340" rx="24"/></clipPath></defs><g clip-path="url(#clip)"><rect width="1200" height="340" rx="26" fill="url(#sky)"/><rect width="1200" height="340" fill="url(#dots)"/>

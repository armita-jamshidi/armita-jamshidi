<g class="drift" style="animation-delay:-18s"><g transform="translate(0 40) scale(0.55)" opacity="0.85"><ellipse cx="0" cy="0" rx="46" ry="20" fill="#fff"/><circle cx="-18" cy="-10" r="20" fill="#fff"/><circle cx="12" cy="-16" r="24" fill="#fff"/></g></g>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Bug hall of fame: a ladybug proudly holding a trophy under a magnifying glass.</title><defs><style>
.sans{font-family:"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bob{animation:bob 3.6s ease-in-out infinite}
.d1{animation-delay:.6s}.d2{animation-delay:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.drift{animation:drift 40s linear infinite}
.drift2{animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1300px)}}
.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.blink,.drift,.drift2,.spin,.drive,.wave,.flow,.cyc,.pop{animation:none}}
</style><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE8F8"/><stop offset="1" stop-color="#F4FAFE"/></linearGradient><clipPath id="clip"><rect width="1200" height="170" rx="24"/></clipPath></defs><g clip-path="url(#clip)"><rect width="1200" height="170" rx="22" fill="#FFF6EE" stroke="#FDE8D9" stroke-width="2"/>
<g transform="translate(150 98)"><g class="bob"><ellipse cx="0" cy="6" rx="30" ry="26" fill="#FF8A65" stroke="#13294B" stroke-width="3"/><line x1="0" y1="-18" x2="0" y2="32" stroke="#13294B" stroke-width="3"/><circle cx="-14" cy="0" r="5" fill="#13294B"/><circle cx="14" cy="0" r="5" fill="#13294B"/><circle cx="-12" cy="18" r="4" fill="#13294B"/><circle cx="12" cy="18" r="4" fill="#13294B"/><circle cx="0" cy="-24" r="14" fill="#13294B"/><circle cx="-5" cy="-26" r="4" fill="#fff"/><circle cx="5" cy="-26" r="4" fill="#fff"/><circle cx="-4" cy="-26" r="2" fill="#13294B"/><circle cx="6" cy="-26" r="2" fill="#13294B"/><path d="M-6 -38 q-8 -10 -14 -8 M6 -38 q8 -10 14 -8" stroke="#13294B" stroke-width="3" fill="none" stroke-linecap="round"/></g></g>
<g transform="translate(260 100)"><g class="bob d1"><path d="M-30 -40 h60 v18 a30 30 0 0 1 -60 0 z" fill="#FFD166" stroke="#13294B" stroke-width="3"/><path d="M-30 -32 h-12 a12 12 0 0 0 12 18 M30 -32 h12 a12 12 0 0 1 -12 18" stroke="#13294B" stroke-width="3" fill="none"/><rect x="-6" y="6" width="12" height="16" fill="#FFD166" stroke="#13294B" stroke-width="3"/><rect x="-24" y="22" width="48" height="12" rx="3" fill="#4B9CD3" stroke="#13294B" stroke-width="3"/><text x="0" y="-16" class="sans" font-size="18" font-weight="800" fill="#13294B" text-anchor="middle">#1</text></g></g>
<g transform="translate(1040 92)"><g class="bob d2"><circle r="38" fill="#EAF4FB" fill-opacity=".6" stroke="#4B9CD3" stroke-width="9"/>
<path d="M28 28 l28 28" stroke="#13294B" stroke-width="13" stroke-linecap="round"/></g></g>
<text x="660" y="82" class="sans" font-size="36" font-weight="800" fill="#13294B" text-anchor="middle">Every bug here is real</text>
<text x="660" y="118" class="sans" font-size="18" fill="#13294B" opacity=".8" text-anchor="middle">Caught, fixed, and turned into lessons. Click one to read the story.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t"><title id="t">A ladybug crawls along a green leaf.</title><defs><g id="lb"><g class="legs" stroke="#1B1B1B" stroke-width="2.6" stroke-linecap="round"><line x1="-8" y1="-10" x2="-11" y2="-19" /><line x1="-8" y1="10" x2="-11" y2="19" /><line x1="0" y1="-10" x2="0" y2="-19" /><line x1="0" y1="10" x2="0" y2="19" /><line x1="8" y1="-10" x2="11" y2="-19" /><line x1="8" y1="10" x2="11" y2="19" /></g><path d="M24 -4 q6 -8 11 -8 M24 4 q6 8 11 8" stroke="#1B1B1B" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="35" cy="-12" r="2" fill="#1B1B1B"/><circle cx="35" cy="12" r="2" fill="#1B1B1B"/><circle cx="17" cy="0" r="9" fill="#1B1B1B"/><circle cx="21" cy="-4" r="2.2" fill="#fff"/><circle cx="21" cy="4" r="2.2" fill="#fff"/><ellipse cx="-2" cy="0" rx="18" ry="15" fill="#E63946" stroke="#1B1B1B" stroke-width="2"/><path d="M-20 0 H15" stroke="#1B1B1B" stroke-width="2"/><circle cx="-9" cy="-7" r="3.6" fill="#1B1B1B"/><circle cx="-9" cy="7" r="3.6" fill="#1B1B1B"/><circle cx="3" cy="-8" r="3" fill="#1B1B1B"/><circle cx="3" cy="8" r="3" fill="#1B1B1B"/><circle cx="-15" cy="0" r="2.4" fill="#1B1B1B" opacity="0"/><ellipse cx="-8" cy="-9" rx="4" ry="2" fill="#fff" opacity=".35"/></g><style>.legs{animation:wig .35s ease-in-out infinite alternate}@keyframes wig{from{transform:translateX(-1.6px)}to{transform:translateX(1.6px)}}.crawl{animation:crawl var(--t,30s) linear infinite}@keyframes crawl{from{transform:translateX(-80px)}to{transform:translateX(1290px)}}.crawlL{animation:crawlL var(--t,30s) linear infinite}@keyframes crawlL{from{transform:translateX(1290px)}to{transform:translateX(-80px)}}.wob{animation:wob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-4deg)}}@media (prefers-reduced-motion:reduce){.legs,.crawl,.crawlL,.wob{animation:none}.crawl,.crawlL{transform:translateX(var(--rx,600px))}}</style><linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7BD389"/><stop offset=".5" stop-color="#4CAF50"/><stop offset="1" stop-color="#3B8F3F"/></linearGradient><clipPath id="clip"><rect width="1200" height="150" rx="24"/></clipPath></defs><g clip-path="url(#clip)"><rect width="1200" height="150" rx="20" fill="#EFFAF5"/>
<path d="M0 98 Q30 92 60 85" stroke="#3B8F3F" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M60 85 Q600 -10 1170 85 Q600 180 60 85 Z" fill="url(#leaf)" stroke="#2E7D32" stroke-width="3"/>
<g stroke="#2E7D32" stroke-width="2.5" fill="none" opacity=".7"><path d="M140 84 q30 -14 55 -20" /><path d="M140 86 q30 14 55 20" /><path d="M260 84 q30 -22 55 -28" /><path d="M260 86 q30 22 55 28" /><path d="M380 84 q30 -28 55 -34" /><path d="M380 86 q30 28 55 34" /><path d="M500 84 q30 -32 55 -38" /><path d="M500 86 q30 32 55 38" /><path d="M620 84 q30 -32 55 -38" /><path d="M620 86 q30 32 55 38" /><path d="M740 84 q30 -30 55 -36" /><path d="M740 86 q30 30 55 36" /><path d="M860 84 q30 -24 55 -30" /><path d="M860 86 q30 24 55 30" /><path d="M980 84 q30 -16 55 -22" /><path d="M980 86 q30 16 55 22" /></g>
<path d="M60 85 Q600 80 1170 85" stroke="#2E7D32" stroke-width="4" fill="none"/>
<g class="crawl" style="--t:16s;--rx:600px;animation-delay:0s"><g transform="translate(0 82) scale(1.05)"><g class="wob"><use href="#lb"/></g></g></g>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="t"><title id="t">Thanks for stopping by! Ladybugs crawl across a teal polka-dot background.</title><defs><g id="lb"><g class="legs" stroke="#1B1B1B" stroke-width="2.6" stroke-linecap="round"><line x1="-8" y1="-10" x2="-11" y2="-19" /><line x1="-8" y1="10" x2="-11" y2="19" /><line x1="0" y1="-10" x2="0" y2="-19" /><line x1="0" y1="10" x2="0" y2="19" /><line x1="8" y1="-10" x2="11" y2="-19" /><line x1="8" y1="10" x2="11" y2="19" /></g><path d="M24 -4 q6 -8 11 -8 M24 4 q6 8 11 8" stroke="#1B1B1B" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="35" cy="-12" r="2" fill="#1B1B1B"/><circle cx="35" cy="12" r="2" fill="#1B1B1B"/><circle cx="17" cy="0" r="9" fill="#1B1B1B"/><circle cx="21" cy="-4" r="2.2" fill="#fff"/><circle cx="21" cy="4" r="2.2" fill="#fff"/><ellipse cx="-2" cy="0" rx="18" ry="15" fill="#E63946" stroke="#1B1B1B" stroke-width="2"/><path d="M-20 0 H15" stroke="#1B1B1B" stroke-width="2"/><circle cx="-9" cy="-7" r="3.6" fill="#1B1B1B"/><circle cx="-9" cy="7" r="3.6" fill="#1B1B1B"/><circle cx="3" cy="-8" r="3" fill="#1B1B1B"/><circle cx="3" cy="8" r="3" fill="#1B1B1B"/><circle cx="-15" cy="0" r="2.4" fill="#1B1B1B" opacity="0"/><ellipse cx="-8" cy="-9" rx="4" ry="2" fill="#fff" opacity=".35"/></g><style>
.sans{font-family:"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bob{animation:bob 3.6s ease-in-out infinite}
.d1{animation-delay:.6s}.d2{animation-delay:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.drift{animation:drift 40s linear infinite}
.drift2{animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1300px)}}
.spin{animation:spin 24s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.blink,.drift,.drift2,.spin,.drive,.wave,.flow,.cyc,.pop{animation:none}}
.legs{animation:wig .35s ease-in-out infinite alternate}@keyframes wig{from{transform:translateX(-1.6px)}to{transform:translateX(1.6px)}}.crawl{animation:crawl var(--t,30s) linear infinite}@keyframes crawl{from{transform:translateX(-80px)}to{transform:translateX(1290px)}}.crawlL{animation:crawlL var(--t,30s) linear infinite}@keyframes crawlL{from{transform:translateX(1290px)}to{transform:translateX(-80px)}}.wob{animation:wob 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-4deg)}}@media (prefers-reduced-motion:reduce){.legs,.crawl,.crawlL,.wob{animation:none}.crawl,.crawlL{transform:translateX(var(--rx,600px))}}</style><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BDEBDD"/><stop offset="1" stop-color="#E6F8F2"/></linearGradient><pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="6" fill="#5CC4A6" opacity=".35"/><circle cx="33" cy="33" r="6" fill="#5CC4A6" opacity=".35"/></pattern><clipPath id="clip"><rect width="1200" height="230" rx="24"/></clipPath></defs><g clip-path="url(#clip)"><rect width="1200" height="230" rx="26" fill="url(#sky)"/><rect width="1200" height="230" fill="url(#dots)"/>
<path d="M0 200 Q300 170 600 195 T1200 185 V230 H0 Z" fill="#8ED6C0"/>
<g class="crawl" style="--t:34s;--rx:300px;animation-delay:-4s"><g transform="translate(0 120) scale(1)"><g class="wob"><use href="#lb"/></g></g></g><g class="crawlL" style="--t:26s;--rx:900px;animation-delay:-15s"><g transform="translate(0 205) scale(0.9) scale(-1 1)"><g class="wob"><use href="#lb"/></g></g></g>
<g transform="translate(600 40)">
<rect x="-220" y="-26" width="440" height="52" rx="26" fill="#fff" stroke="#2FA084" stroke-width="3"/>
<text x="0" y="9" class="sans" font-size="24" font-weight="800" fill="#13294B" text-anchor="middle">Thanks for stopping by! 💙</text></g></g></svg>